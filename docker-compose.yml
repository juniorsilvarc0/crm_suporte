# Ambiente de desenvolvimento local em Docker — SEM o stack do CLI da Supabase.
#   docker compose up -d --build     -> banco + API + dashboard em http://localhost:3000
#   ./scripts/db-local-apply.sh      -> aplica migrations + seed (admin@local / 123456)
#   docker compose logs -f web       -> acompanha os logs
#   docker compose down              -> derruba os containers (o volume do banco fica)
#
# Arquitetura local enxuta (tudo com nomes exclusivos crm-suporte-*):
#   db       supabase/postgres (container único) — extensões, roles e vault da Supabase
#   rest     PostgREST — a API que o supabase-js consome
#   gateway  nginx na porta 54321 imitando o roteamento do Kong (/rest/v1/*)
#   web      Next.js em modo dev
# Realtime e Storage NÃO existem neste stack: chat não atualiza ao vivo em dev
# e upload de mídia não funciona — o resto do app opera normalmente.
#
# As credenciais ficam em .env.local (gitignored). Edite o arquivo e rode
# `docker compose restart web` para aplicar variáveis de servidor.
services:
  db:
    image: public.ecr.aws/supabase/postgres:17.6.1.140
    container_name: crm-suporte-db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      # Demo secret padrão do ambiente local da Supabase — casa com as chaves
      # anon/service_role de .env.local.example. NÃO é segredo de produção.
      JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
    ports:
      # 54322 no host, espelhando a convenção do supabase local (psql direto).
      - "54322:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db-init.sql:/docker-entrypoint-initdb.d/zz-crm-suporte-init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rest:
    image: public.ecr.aws/supabase/postgrest:v14.14
    container_name: crm-suporte-rest
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      PGRST_DB_USE_LEGACY_GUCS: "false"
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    container_name: crm-suporte-gateway
    depends_on:
      - rest
    ports:
      # A porta que o supabase-js espera (SUPABASE_URL=…:54321 no .env.local).
      - "54321:80"
    volumes:
      - ./docker/dev-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-suporte-web
    depends_on:
      - gateway
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    # Permite ao container alcançar o gateway publicado no host (54321).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: development
      # File watching confiável em bind mounts do Docker Desktop (macOS/Windows).
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      # Código do host montado para hot reload...
      - .:/app
      # ...mas node_modules vive no container (volume anônimo seedado da imagem).
      - /app/node_modules
    command: pnpm dev
    restart: unless-stopped

volumes:
  db-data:
