# ============================================================================
# Vhost do CRM Suporte no nginx do HOST — a borda da VPS compartilhada.
#
# Não é usado como está: `crmsup.sh nginx http|https` troca __APP_DOMAIN__,
# __API_DOMAIN__, __APP_PORT__ e __GATEWAY_PORT__ pelos valores do stack.env.
# Instalação em deploy/README.md §Borda.
#
# ⚠️ Este é o ÚNICO ponto em que o CRM toca infraestrutura compartilhada. É um
# arquivo NOVO em sites-available: nunca edite o vhost de outro site.
# ⚠️ O `map` abaixo tem nome PRÓPRIO. O host já define `$connection_upgrade`
# em conf.d, num arquivo de outra stack: depender dele deixaria este vhost
# quebrado (e o reload de TODOS travado) no dia em que aquele arquivo sair; e
# redefinir o mesmo nome reprova o `nginx -t`.
# ============================================================================

map $http_upgrade $crmsup_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name __APP_DOMAIN__ __API_DOMAIN__;

    # Desafio do Let's Encrypt (`certbot certonly --webroot`).
    location /.well-known/acme-challenge/ {
        root /var/www/crmsup-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ==== HTTPS — só depois que o certificado existir ====

server {
    listen 443 ssl;
    server_name __APP_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__APP_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__APP_DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Anexos do chat sobem pelo app: casa com `proxyClientMaxBodySize` do
    # next.config.ts.
    client_max_body_size 64m;

    # O app entra pelo appgw do stack (porta __APP_PORT__), que reparte entre as
    # duas réplicas e drena uma de cada vez no deploy (deploy/app-gateway.conf).
    location / {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_set_header Host $host;
        # ⚠️ SOBRESCREVE, não acrescenta: o rate limit do login usa a 1ª
        # entrada do X-Forwarded-For. Com `$proxy_add_x_forwarded_for`, quem
        # mandasse um IP inventado no cabeçalho escaparia do limite.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # ⚠️ Webhook da uazapi: o segredo de entrada vai na query (`?s=`). O
    # access.log e o error.log do host são COMPARTILHADOS com as outras stacks:
    # nada desta rota vai para disco (até o `crit` carregaria a URL). Erro de
    # verdade aparece no log do app e no painel da uazapi.
    location = /api/chat/webhook/uazapi {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

server {
    listen 443 ssl;
    server_name __API_DOMAIN__;

    # Um certificado só, com os dois nomes (o lineage leva o nome do app).
    ssl_certificate     /etc/letsencrypt/live/__APP_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__APP_DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Mesmo teto do gateway e do bucket `chat-media`.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:__GATEWAY_PORT__;
        proxy_http_version 1.1;
        # Realtime é WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $crmsup_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }
}
