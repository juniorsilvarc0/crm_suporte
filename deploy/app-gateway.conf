# ============================================================================
# Gateway do APP (container crmsup-appgw) — só reparte o tráfego do app entre
# as duas réplicas. NÃO é o gateway da API (gateway.conf), que continua sendo
# o caminho do app até o banco e nunca é tocado num deploy do app.
#
# Não é usado como está: `crmsup.sh` troca __WEB_DOWN__/__WEB2_DOWN__ (vazio ou
# ` down`) e grava em APPGW_CONF_FILE, aplicando com `nginx -t` + reload.
#
# Deploy sem interrupção (`crmsup.sh subir` → `trocar`), uma réplica por vez:
#   1. a réplica sai do rodízio (` down` + reload): requisição nova vai à outra;
#   2. espera DRENAR o que ela está atendendo (webhook com mídia leva segundos);
#   3. recria a réplica, com parada graciosa de até 160 s (o Next termina o
#      que está em curso), e espera ficar healthy;
#   4. ela volta ao rodízio. Se não ficar healthy, fica FORA, e a outra segue.
# Requisição de até ~200 s (dreno + parada) termina: cabem o webhook e o envio
# de vídeo pelo chat. O webhook da uazapi nunca fica sem resposta. Medido em
# 2026-09-29 (PROGRESS).
#
# ⚠️ Repetir POST que JÁ chegou (`non_idempotent`) é proibido: o webhook repassa
# a mensagem à IA a cada processamento, e ela responderia duas vezes.
# ============================================================================

# Resolver do Docker: a réplica recriada pode ganhar outro IP (em geral o
# Docker devolve o mesmo, com outro MAC), e o upstream precisa enxergá-lo em
# segundos (`resolve` + `valid=2s`).
resolver 127.0.0.11 valid=2s ipv6=off;

# `hash` pelo IP real do cliente (X-Real-IP, posto pelo nginx do host) prende
# cada um numa réplica: o rate limit do login é por processo.
# ⚠️ `max_fails=0`: o nginx NUNCA tira uma réplica do rodízio por conta
# própria. Quem tira é o deploy (` down`, explícito). Com `max_fails=1`, um
# único reset transitório tirou a réplica saudável por 2s enquanto a outra
# estava em troca — e sem ninguém no rodízio vieram 216 falhas (medido em
# 2026-09-29). Réplica que recusa conexão ainda é contornada por
# `proxy_next_upstream`, requisição a requisição.
#
# ⚠️ Pelo NOME DO CONTAINER, nunca pelo do serviço (`web`). Enquanto a réplica
# é recriada, o DNS do Docker não a acha e manda a pergunta para fora. `web` é
# um domínio de topo de verdade, e a resposta foi 127.0.53.53 (colisão de nome
# da ICANN), um upstream falso (medido em 2026-09-29). `crmsup-web` volta
# NXDOMAIN, e a réplica só sai da lista.
upstream crmsup_app {
  zone crmsup_app 64k;
  hash $http_x_real_ip consistent;
  # ⚠️ No nginx 1.29 o keepalive com o upstream passou a ser o PADRÃO, e a
  # conexão ociosa fica guardada por 60 s. O Node 22 a fecha aos ~6 s. Uma
  # requisição que chega no instante do fechamento leva RST: o GET vai à outra
  # réplica, mas o POST vira 502 (medido em 2026-09-29: 2 em ~17 mil, os dois
  # com 6,0 s de ociosidade). Fechando antes do lado do nginx, a corrida
  # deixa de existir.
  keepalive_timeout 4s;
  server crmsup-web:3000 resolve max_fails=0__WEB_DOWN__;
  server crmsup-web-2:3000 resolve max_fails=0__WEB2_DOWN__;
}

server {
  listen 8080;
  server_name _;

  # O log de acesso do app é o do nginx do host (a borda); aqui repetiria tudo,
  # inclusive o segredo do webhook.
  access_log off;
  # Anexos do chat sobem pelo app: casa com `proxyClientMaxBodySize`.
  client_max_body_size 64m;

  # O nginx do host já normalizou estes cabeçalhos (X-Forwarded-For
  # SOBRESCRITO com o IP real — o rate limit usa a 1ª entrada): passam como
  # vieram, sem acrescentar o IP do host.
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $http_x_forwarded_for;
  proxy_set_header X-Real-IP $http_x_real_ip;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  # Réplica que recusa a conexão: a outra atende. POST só é repetido se NÃO
  # chegou à primeira. Réplica que SUMIU da rede (queda, restart fora do
  # roteiro) não recusa: cada requisição espera o connect timeout, e a que
  # estiver esperando quando o resolver atualizar a lista (≤ 3 s) volta 502, sem
  # ir à outra (limite do nginx). Daí o timeout curto: na bridge, o handshake
  # leva menos de 1 ms.
  proxy_next_upstream error timeout;
  proxy_next_upstream_tries 2;
  proxy_connect_timeout 500ms;
  proxy_read_timeout 300s;

  location / {
    proxy_pass http://crmsup_app;
  }

  # O segredo do webhook vai na query: nem erro desta rota vai para o log.
  location = /api/chat/webhook/uazapi {
    error_log /dev/null crit;
    proxy_pass http://crmsup_app;
  }

  # API v1 (D8): `?phone=` e `?cnpj=` são dado pessoal. O erro de upstream (réplica
  # em troca) grava a linha da requisição, com a query, no log do container.
  location /api/v1/ {
    error_log /dev/null crit;
    proxy_pass http://crmsup_app;
  }
}
