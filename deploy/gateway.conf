# ============================================================================
# Gateway de produção — o papel que o Kong/Envoy cumpre no self-host oficial.
# Roteia só o que o NAVEGADOR precisa alcançar do Supabase.
#
# ⚠️ Rota que não estiver aqui NÃO existe na internet. É deliberado: o oficial
# expõe também /auth/v1, /pg/ (postgres-meta) e o Studio — nada disso roda
# neste stack, e o que não roda não pode ser mal configurado.
# ============================================================================

# Resolver do Docker: sem ele, o nginx resolve o nome do container UMA vez, no
# boot, e continua batendo num IP morto depois que o container é recriado.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  # Mídia do WhatsApp (áudio e vídeo) sobe por aqui.
  client_max_body_size 50m;

  # Cabeçalhos DUROS: este host serve arquivo enviado por terceiro.
  # `sandbox` neutraliza script mesmo se o Content-Type escapar.
  add_header Content-Security-Policy "sandbox" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  # A raiz não é nada: quem varre a internet recebe 404 em vez de um mapa dos
  # serviços internos.
  location = / { return 404; }

  # --- REST ------------------------------------------------------------------
  # ⚠️ Com VARIÁVEL no `proxy_pass`, o nginx NÃO troca o prefixo casado da URI.
  # Sem o `rewrite`, `/rest/v1/chat_conversations` chega no PostgREST como `/`
  # e a resposta é o swagger raiz, com 200 — parece funcionar e não funciona.
  # A variável existe para re-resolver o DNS do container; o `rewrite` é o
  # preço dela.
  location /rest/v1/ {
    set $upstream_rest http://rest:3000;
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass $upstream_rest;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # --- Realtime (WebSocket) --------------------------------------------------
  location /realtime/v1/ {
    set $upstream_rt http://realtime-dev.crmsup-realtime:4000;
    rewrite ^/realtime/v1/(.*)$ /socket/$1 break;
    proxy_pass $upstream_rt;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # ⚠️ O Realtime deriva o TENANT do primeiro rótulo do Host. O host público
    # (api.…) faria ele procurar um tenant "api" que não existe.
    proxy_set_header Host realtime-dev.crmsup-realtime;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # Conexão de chat fica aberta por horas; o default de 60s a derrubaria.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # --- Storage ---------------------------------------------------------------
  location /storage/v1/ {
    set $upstream_st http://storage:5000;
    rewrite ^/storage/v1/(.*)$ /$1 break;
    proxy_pass $upstream_st;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # O storage-api monta a URL pública a partir deste cabeçalho.
    proxy_set_header X-Forwarded-Path /storage/v1;
    proxy_request_buffering off;
  }

  location / { return 404; }
}
