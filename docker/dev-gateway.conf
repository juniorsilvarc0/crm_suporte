# Gateway LOCAL (porta 54321) — imita o roteamento do Kong da Supabase para o
# que o app usa: REST, Realtime (WebSocket) e Storage. Espelha o gateway de
# produção, com `proxy_pass` estático (sem variável, o nginx troca o prefixo
# casado sozinho — com variável seria preciso `rewrite`, armadilha registrada).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;

  # Mídia do WhatsApp (áudio e vídeo) sobe por aqui.
  client_max_body_size 50m;

  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /realtime/v1/ {
    proxy_pass http://realtime:4000/socket/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # O Realtime deriva o TENANT do primeiro rótulo do Host (`realtime-dev`).
    proxy_set_header Host realtime-dev.crm-suporte-realtime;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /storage/v1/ {
    proxy_pass http://storage:5000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # O storage-api monta URLs a partir deste cabeçalho.
    proxy_set_header X-Forwarded-Path /storage/v1;
    proxy_request_buffering off;
  }

  location / {
    return 404;
  }
}
