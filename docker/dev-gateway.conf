# Gateway LOCAL (porta 54321) — imita o roteamento do Kong da Supabase para o
# que o app realmente usa em dev: /rest/v1/* → PostgREST. Realtime e Storage não
# existem neste stack enxuto; as rotas respondem 404 e o supabase-js segue o
# padrão de leitura resiliente do app.
server {
  listen 80;

  # supabase-js: REST e RPC (barra final em proxy_pass remove o prefixo casado)
  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    return 404;
  }
}
